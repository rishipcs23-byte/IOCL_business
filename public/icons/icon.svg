<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Background Card -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  
  <!-- Outer Accent Ring -->
  <rect x="24" y="24" width="464" height="464" rx="94" fill="none" stroke="url(#accentGrad)" stroke-width="8" opacity="0.8"/>
  
  <!-- Icon Group -->
  <g filter="url(#shadow)" transform="translate(106, 96)">
    <!-- Fuel Pump Main Body -->
    <rect x="50" y="80" width="160" height="230" rx="20" fill="#ffffff"/>
    
    <!-- Fuel Pump Screen -->
    <rect x="70" y="110" width="120" height="60" rx="10" fill="#0f172a"/>
    <text x="130" y="146" font-family="-apple-system, sans-serif" font-weight="900" font-size="22" fill="#38bdf8" text-anchor="middle">IOCL</text>
    
    <!-- Nozzle & Hose -->
    <path d="M 210 140 C 270 140, 270 270, 240 290 C 220 300, 200 280, 210 260 L 210 210" fill="none" stroke="#f97316" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 210 210 L 240 180 L 250 190 L 225 215" fill="#f97316"/>
    
    <!-- Pump Base Base Accent -->
    <rect x="35" y="310" width="190" height="24" rx="12" fill="url(#accentGrad)"/>
    <circle cx="90" cy="240" r="14" fill="#2563eb"/>
    <circle cx="130" cy="240" r="14" fill="#2563eb"/>
    <circle cx="170" cy="240" r="14" fill="#2563eb"/>
  </g>
</svg>
